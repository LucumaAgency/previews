<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucuma Previews</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#174FCA;--n:#15171c;--g:#6b6f7a;--ln:#e6e8ee;--bg:#f4f5f8}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--n);height:100vh;display:grid;grid-template-columns:300px 1fr;font-size:14px}
aside{background:#fff;border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}.brand i{width:30px;height:30px;border-radius:8px;background:var(--b);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.search{padding:12px 16px;border-bottom:1px solid var(--ln)}.search input{width:100%;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;font:inherit;font-size:13px}
nav{overflow:auto;flex:1;padding:8px 0}
.cl{padding:10px 20px 4px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g);font-weight:600}
.ds{text-decoration:none;display:block;padding:9px 20px 9px 20px;cursor:pointer;border-left:3px solid transparent}.ds:hover{background:var(--bg)}.ds.on{border-color:var(--b);background:#eef2fc}
.ds b{display:block;font-weight:600}.ds small{color:var(--g);font-size:12px}
main{display:flex;flex-direction:column;min-height:0}
.bar{background:#fff;border-bottom:1px solid var(--ln);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:15px;font-weight:700}.bar .nota{color:var(--g);font-size:12.5px}
.bar select,.bar button,.bar a.btn{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;cursor:pointer;color:var(--n);text-decoration:none}
.bar button.on{background:var(--n);color:#fff;border-color:var(--n)}.bar .sp{flex:1}.bar a.btn.p{background:var(--b);color:#fff;border-color:var(--b)}
.dev{display:flex;gap:4px}
.stage{flex:1;display:grid;place-items:center;padding:18px;overflow:auto}
.frame{background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.08);overflow:hidden;transition:width .3s,height .3s;width:100%;height:100%}
.frame iframe{width:100%;height:100%;border:0;display:block}
.frame.tablet{width:820px;height:1180px;max-height:100%}.frame.mobile{width:390px;height:844px;max-height:100%}
.empty{color:var(--g);text-align:center;max-width:420px;line-height:1.6}.empty code{background:#fff;padding:2px 6px;border-radius:4px;font-size:12px}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:40vh}}
</style></head><body>
<aside><div class="brand"><i>LA</i>Lucuma Previews</div><div class="search"><input id="q" placeholder="Buscar cliente o diseño…"></div><nav id="nav"></nav></aside>
<main><div class="bar" id="bar" hidden><div><h1 id="t"></h1><div class="nota" id="nota"></div></div><select id="ver"></select><select id="entry"></select><span class="sp"></span><div class="dev"><button data-d="desktop" class="on">Desktop</button><button data-d="tablet">Tablet</button><button data-d="mobile">Móvil</button></div><button id="reload">↻</button><a class="btn p" id="open" target="_blank">Abrir en pestaña</a></div>
<div class="stage"><div class="empty" id="empty">Sin diseños todavía.<br>Sube uno con <code>node push.js cliente diseño carpeta</code> o <code>POST /api/push</code>.</div><div class="frame" id="frame" hidden><iframe id="if"></iframe></div></div></main>
<script>
let tree=[],cur=null;const $=s=>document.querySelector(s);
async function load(){tree=await (await fetch('api/list')).json();render();route();}
function render(){const q=$('#q').value.toLowerCase();let h='';for(const c of tree){const ds=c.disenos.filter(d=>!q||(c.cliente+' '+d.diseno+' '+(d.versiones[0].titulo||'')).toLowerCase().includes(q));if(!ds.length)continue;h+=`<div class="cl">${c.cliente}</div>`;for(const d of ds){const v=d.versiones[0];const on=cur&&cur.c===c.cliente&&cur.d===d.diseno?' on':'';h+=`<a class="ds${on}" href="#/${c.cliente}/${d.diseno}/${v.v}"><b>${v.titulo||d.diseno}</b><small>${d.versiones.length} versión${d.versiones.length>1?'es':''} · ${new Date(v.createdAt).toLocaleDateString('es-PE',{day:'2-digit',month:'short'})}</small></a>`}}$('#nav').innerHTML=h||'<div class="cl">Nada que mostrar</div>';}
function route(){const m=location.hash.match(/^#\/([^/]+)\/([^/]+)\/(v\d+)?\/?(.*)$/);if(!m){cur=null;return}const c=tree.find(x=>x.cliente===m[1]);const d=c&&c.disenos.find(x=>x.diseno===m[2]);if(!d)return;const v=d.versiones.find(x=>x.v===m[3])||d.versiones[0];const entry=m[4]&&v.htmls.includes(m[4])?m[4]:v.entry;cur={c:c.cliente,d:d.diseno,v,entry};show(d);render();}
function show(d){const {c,v,entry}=cur;$('#bar').hidden=false;$('#empty').hidden=true;$('#frame').hidden=false;$('#t').textContent=(v.titulo||cur.d)+' · '+c;$('#nota').textContent=v.nota?v.nota+' · ':''; $('#nota').textContent+=new Date(v.createdAt).toLocaleString('es-PE');
$('#ver').innerHTML=d.versiones.map(x=>`<option value="${x.v}"${x.v===v.v?' selected':''}>${x.v}${x===d.versiones[0]?' (última)':''}</option>`).join('');
$('#entry').innerHTML=v.htmls.map(h=>`<option${h===entry?' selected':''}>${h}</option>`).join('');
const src=`p/${c}/${cur.d}/${v.v}/${entry}`;$('#if').src=src;$('#open').href=src;}
$('#ver').onchange=e=>location.hash=`#/${cur.c}/${cur.d}/${e.target.value}`;$('#entry').onchange=e=>location.hash=`#/${cur.c}/${cur.d}/${cur.v.v}/${e.target.value}`;
$('#reload').onclick=()=>{$('#if').src=$('#if').src};$('#q').oninput=render;
document.querySelectorAll('.dev button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dev button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#frame').className='frame '+b.dataset.d});
addEventListener('hashchange',route);load();
</script></body></html>
